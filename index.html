var LATEST=/*LATEST*/{"d": 55, "h": "<div class=\"badges\"><span class=\"badge\">DAY 55</span><span class=\"badge alt\">生活场景</span><span class=\"badge\">2026-10-18</span></div>\n<h1>遗失物品与保险</h1>\n<p class=\"sub\">Lost Property and Insurance</p>\n<p class=\"intro\">丢东西其实只考三件事：说清丢了什么、在哪儿落下的、拿到报案编号去找保险。</p>\n<div class=\"plan\"><div>全篇约 10 分钟（通读＋跟读一遍）</div><div>没时间就只看第 1 节：3 分钟，把三句念熟，当天够用</div><div>第 5 节以后是查漏用的，看不完不影响开口</div></div>\n\n<h2>01 今天只记这 3 句 <span class=\"mins\">约 3 分钟</span></h2>\n<div class=\"three\"><span class=\"req\">必背</span><div class=\"p\" data-say=\"I've lost my wallet.\">I've lost my ___.</div><div class=\"ipa\">/aɪv ˈlɒst maɪ ˈwɒlɪt/</div><div class=\"cn\">我的……丢了。（先说丢了什么，对方才知道怎么帮你）</div><div class=\"sw\"><div class=\"row\"><b>wallet</b> <span class=\"ipa\">/ˈwɒlɪt/</span> 钱包</div><div class=\"row\"><b>phone</b> <span class=\"ipa\">/fəʊn/</span> 手机</div><div class=\"row\"><b>passport</b> <span class=\"ipa\">/ˈpɑːspɔːt/</span> 护照</div></div></div>\n<div class=\"three\"><span class=\"req\">必背</span><div class=\"p\" data-say=\"I left it on the train.\">I left it on the ___.</div><div class=\"ipa\">/aɪ ˈleft ɪt ɒn ðə ˈtreɪn/</div><div class=\"cn\">我把它落在……上了。（忘拿、落下用 left）</div><div class=\"sw\"><div class=\"row\"><b>train</b> <span class=\"ipa\">/treɪn/</span> 火车</div><div class=\"row\"><b>bus</b> <span class=\"ipa\">/bʌs/</span> 公交车</div><div class=\"row\"><b>table</b> <span class=\"ipa\">/ˈteɪbl/</span> 桌子（在餐厅、咖啡店落下时）</div></div></div>\n<div class=\"three\"><span class=\"req\">必背</span><div class=\"p\" data-say=\"Can I get a report for my insurance?\">Can I get a ___ for my insurance?</div><div class=\"ipa\">/kən aɪ ˌɡet ə rɪˈpɔːt fə maɪ ɪnˈʃʊərəns/</div><div class=\"cn\">能给我一份……吗？我要拿去报保险。</div><div class=\"sw\"><div class=\"row\"><b>report</b> <span class=\"ipa\">/rɪˈpɔːt/</span> 报案记录</div><div class=\"row\"><b>crime number</b> <span class=\"ipa\">/ˈkraɪm ˌnʌmbə/</span> 报案编号</div><div class=\"row\"><b>letter</b> <span class=\"ipa\">/ˈletə/</span> 证明信</div></div><div class=\"gl\"><span class=\"gw\">insurance</span> <span class=\"ipa\">/ɪnˈʃʊərəns/</span> 保险</div></div>\n\n<h2>02 核心表达 <span class=\"mins\">约 3 分钟</span></h2>\n<div class=\"card\"><div class=\"en\">Has anyone handed in a wallet?</div><div class=\"ipa\">/həz ˈeniwʌn ˌhændɪd ɪn ə ˈwɒlɪt/</div><div class=\"cn\">有人交来一个钱包吗？</div><div class=\"use\">到前台、车站服务台开口第一句，把 wallet 换成你丢的东西。</div><div class=\"gl\"><span class=\"gw\">hand in</span> <span class=\"ipa\">/ˌhænd ˈɪn/</span> 上交（把捡到的东西交上去）</div></div>\n<div class=\"card\"><div class=\"en\">It's a black leather wallet.</div><div class=\"ipa\">/ɪts ə ˌblæk ˈleðə ˈwɒlɪt/</div><div class=\"cn\">是一个黑色的皮钱包。</div><div class=\"use\">描述顺序：颜色在前、材质在后、东西放最后。</div><div class=\"gl\"><span class=\"gw\">leather</span> <span class=\"ipa\">/ˈleðə/</span> 皮革、真皮</div></div>\n<div class=\"card\"><div class=\"en\">I last had it this morning.</div><div class=\"ipa\">/aɪ ˈlɑːst hæd ɪt ðɪs ˈmɔːnɪŋ/</div><div class=\"cn\">我最后一次拿着它是今天早上。</div><div class=\"use\">对方一定会问「最后在哪儿、什么时候见到」，用这句答时间。</div><div class=\"dont\">✗ I lost it at this morning.</div></div>\n<div class=\"card\"><div class=\"en\">It's got my cards in it.</div><div class=\"ipa\">/ɪts ɡɒt maɪ ˈkɑːdz ɪn ɪt/</div><div class=\"cn\">里面有我的银行卡。</div><div class=\"use\">说明里面有什么，方便对方核对是不是你的。</div></div>\n<div class=\"card\"><div class=\"en\">I need to cancel my card.</div><div class=\"ipa\">/aɪ ˈniːd tə ˈkænsl maɪ ˈkɑːd/</div><div class=\"cn\">我得把银行卡冻结（挂失）。</div><div class=\"use\">给银行打电话时开门见山说这句；英国人说「挂失」就是 cancel。</div><div class=\"gl\"><span class=\"gw\">cancel</span> <span class=\"ipa\">/ˈkænsl/</span> 取消；这里指挂失、冻结</div></div>\n<div class=\"card\"><div class=\"en\">Can I leave my number?</div><div class=\"ipa\">/kən aɪ ˈliːv maɪ ˈnʌmbə/</div><div class=\"cn\">我能留个电话吗？</div><div class=\"use\">暂时没找到，让对方找到后联系你。</div><div class=\"dont\">✗ Can I stay my number?</div></div>\n<div class=\"card\"><div class=\"en\">I think it was stolen.</div><div class=\"ipa\">/aɪ ˈθɪŋk ɪt wəz ˈstəʊlən/</div><div class=\"cn\">我觉得是被偷了。</div><div class=\"use\">不确定是丢了还是被偷时，用 I think 先说出你的判断。</div><div class=\"dont\">✗ I think it was stealed.</div><div class=\"gl\"><span class=\"gw\">stolen</span> <span class=\"ipa\">/ˈstəʊlən/</span> 被偷（steal 的过去分词）</div></div>\n<div class=\"card\"><div class=\"en\">What do I need for the claim?</div><div class=\"ipa\">/ˈwɒt du aɪ ˈniːd fə ðə ˈkleɪm/</div><div class=\"cn\">理赔需要准备什么材料？</div><div class=\"use\">给保险公司或公司行政打电话时问。</div><div class=\"gl\"><span class=\"gw\">claim</span> <span class=\"ipa\">/kleɪm/</span> （保险）理赔申请</div></div>\n\n<h2>03 短语速查 <span class=\"mins\">约 2 分钟</span></h2>\n<div class=\"ph\"><div class=\"ptop\"><span class=\"pw\">lost property</span><span class=\"ipa\">/ˌlɒst ˈprɒpəti/</span></div><div class=\"mean\">失物招领处</div><div class=\"lit\">英式说法，车站、商场、酒店都这么叫；美式才说 lost and found。</div><div class=\"eg\"><i>Where's lost property?</i><span class=\"ipa\">/ˌweəz ˌlɒst ˈprɒpəti/</span> 失物招领处在哪儿？</div></div>\n<div class=\"ph\"><div class=\"ptop\"><span class=\"pw\">hand in</span><span class=\"ipa\">/ˌhænd ˈɪn/</span></div><div class=\"mean\">（把捡到的东西）交上去</div><div class=\"lit\">问有没有人捡到，最常用的就是 Has anyone handed in…?</div><div class=\"eg\"><i>Someone handed it in.</i><span class=\"ipa\">/ˌsʌmwʌn ˌhændɪd ɪt ˈɪn/</span> 有人把它交上来了。</div></div>\n<div class=\"ph\"><div class=\"ptop\"><span class=\"pw\">go missing</span><span class=\"ipa\">/ˌɡəʊ ˈmɪsɪŋ/</span></div><div class=\"mean\">不见了、找不着了</div><div class=\"lit\">不确定是丢了还是被偷，用它最稳妥。</div><div class=\"eg\"><i>My bag's gone missing.</i><span class=\"ipa\">/maɪ ˈbæɡz ˌɡɒn ˈmɪsɪŋ/</span> 我的包不见了。</div></div>\n<div class=\"ph\"><div class=\"ptop\"><span class=\"pw\">turn up</span><span class=\"ipa\">/ˌtɜːn ˈʌp/</span></div><div class=\"mean\">（丢的东西）找到了、冒出来了</div><div class=\"lit\">主语是东西本身；工作人员常说 If it turns up, we'll call you.</div><div class=\"eg\"><i>It might turn up.</i><span class=\"ipa\">/ɪt maɪt ˌtɜːn ˈʌp/</span> 说不定会找到的。</div></div>\n<div class=\"ph\"><div class=\"ptop\"><span class=\"pw\">look out for</span><span class=\"ipa\">/ˌlʊk ˈaʊt fə/</span></div><div class=\"mean\">帮忙留意</div><div class=\"lit\">请前台、司机、店员帮你多看一眼时用。</div><div class=\"eg\"><i>Can you look out for it?</i><span class=\"ipa\">/kən ju ˌlʊk ˈaʊt fər ɪt/</span> 你能帮我留意一下吗？</div></div>\n<div class=\"ph\"><div class=\"ptop\"><span class=\"pw\">a crime number</span><span class=\"ipa\">/ə ˈkraɪm ˌnʌmbə/</span></div><div class=\"mean\">报案编号</div><div class=\"lit\">全称 crime reference number；报警后拿到它，保险理赔几乎都要。</div><div class=\"eg\"><i>I need a crime number.</i><span class=\"ipa\">/aɪ ˈniːd ə ˈkraɪm ˌnʌmbə/</span> 我需要一个报案编号。</div></div>\n<div class=\"ph\"><div class=\"ptop\"><span class=\"pw\">by mistake</span><span class=\"ipa\">/baɪ mɪˈsteɪk/</span></div><div class=\"mean\">不小心、拿错了</div><div class=\"lit\">包被别人误拿、你拿错别人的东西时都用它。</div><div class=\"eg\"><i>Someone took it by mistake.</i><span class=\"ipa\">/ˌsʌmwʌn ˈtʊk ɪt baɪ mɪˈsteɪk/</span> 有人不小心拿错了。</div></div>\n\n<h2>04 完整对话 <span class=\"mins\">约 2 分钟</span></h2>\n<div class=\"dlg\">\n<div class=\"turn you\"><div class=\"who\">You</div><div class=\"l\">Hi, I think I left my bag on the train.</div><div class=\"ipa\">/ˈhaɪ, aɪ ˈθɪŋk aɪ ˌleft maɪ ˈbæɡ ɒn ðə ˈtreɪn/</div><div class=\"t\">你好，我好像把包落在火车上了。</div></div>\n<div class=\"turn\"><div class=\"who\">Staff</div><div class=\"l\">Oh no. Which train was it?</div><div class=\"ipa\">/əʊ ˈnəʊ. ˈwɪtʃ ˈtreɪn wəz ɪt/</div><div class=\"t\">哎呀。是哪趟车？</div></div>\n<div class=\"turn you\"><div class=\"who\">You</div><div class=\"l\">The eight fifteen from Oxford.</div><div class=\"ipa\">/ði ˌeɪt fɪfˈtiːn frəm ˈɒksfəd/</div><div class=\"t\">从牛津过来的 8 点 15 那趟。</div></div>\n<div class=\"turn\"><div class=\"who\">Staff</div><div class=\"l\">OK. What does it look like?</div><div class=\"ipa\">/ˌəʊˈkeɪ. ˈwɒt dəz ɪt ˈlʊk laɪk/</div><div class=\"t\">好。包长什么样？</div></div>\n<div class=\"turn you\"><div class=\"who\">You</div><div class=\"l\">It's a small black backpack.</div><div class=\"ipa\">/ɪts ə ˌsmɔːl ˌblæk ˈbækpæk/</div><div class=\"t\">一个黑色的小双肩包。</div><div class=\"gl\"><span class=\"gw\">backpack</span> <span class=\"ipa\">/ˈbækpæk/</span> 双肩包</div></div>\n<div class=\"turn\"><div class=\"who\">Staff</div><div class=\"l\">Anything inside with your name on it?</div><div class=\"ipa\">/ˌeniθɪŋ ɪnˈsaɪd wɪð jə ˈneɪm ɒn ɪt/</div><div class=\"t\">里面有写着你名字的东西吗？</div></div>\n<div class=\"turn you\"><div class=\"who\">You</div><div class=\"l\">Yes, my laptop and a notebook.</div><div class=\"ipa\">/ˈjes, maɪ ˈlæptɒp ənd ə ˈnəʊtbʊk/</div><div class=\"t\">有，我的笔记本电脑和一个本子。</div></div>\n<div class=\"turn\"><div class=\"who\">Staff</div><div class=\"l\">Let me check. Nothing yet, I'm afraid.</div><div class=\"ipa\">/ˈlet mi ˈtʃek. ˈnʌθɪŋ ˈjet, aɪm əˈfreɪd/</div><div class=\"t\">我查一下……恐怕暂时还没有。</div></div>\n<div class=\"turn you\"><div class=\"who\">You</div><div class=\"l\">Oh. What should I do now?</div><div class=\"ipa\">/əʊ. ˈwɒt ʃəd aɪ ˈduː naʊ/</div><div class=\"t\">噢。那我现在该怎么办？</div></div>\n<div class=\"turn\"><div class=\"who\">Staff</div><div class=\"l\">Fill in this form. We'll call you if it turns up.</div><div class=\"ipa\">/ˌfɪl ɪn ðɪs ˈfɔːm. wiːl ˈkɔːl ju ɪf ɪt ˌtɜːnz ˈʌp/</div><div class=\"t\">填一下这张表。找到了我们给你打电话。</div></div>\n<div class=\"turn you\"><div class=\"who\">You</div><div class=\"l\">Thanks. Can I leave my UK number?</div><div class=\"ipa\">/ˈθæŋks. kən aɪ ˌliːv maɪ ˌjuːˈkeɪ ˈnʌmbə/</div><div class=\"t\">谢谢。我留英国的手机号可以吗？</div></div>\n<div class=\"turn\"><div class=\"who\">Staff</div><div class=\"l\">Of course. If it was stolen, tell the police.</div><div class=\"ipa\">/əv ˈkɔːs. ɪf ɪt wəz ˈstəʊlən, ˌtel ðə pəˈliːs/</div><div class=\"t\">当然。如果是被偷了，要去报警。</div></div>\n<div class=\"turn you\"><div class=\"who\">You</div><div class=\"l\">Do I need that for my insurance?</div><div class=\"ipa\">/du aɪ ˈniːd ˈðæt fə maɪ ɪnˈʃʊərəns/</div><div class=\"t\">报保险需要那个吗？</div></div>\n<div class=\"turn\"><div class=\"who\">Staff</div><div class=\"l\">Yes, they'll ask for a crime number.</div><div class=\"ipa\">/ˈjes, ðeɪl ˌɑːsk fər ə ˈkraɪm ˌnʌmbə/</div><div class=\"t\">要的，保险公司会要报案编号。</div></div>\n<div class=\"turn you\"><div class=\"who\">You</div><div class=\"l\">Got it. Thanks for your help.</div><div class=\"ipa\">/ˌɡɒt ɪt. ˈθæŋks fə jə ˈhelp/</div><div class=\"t\">明白了，谢谢你帮忙。</div></div>\n<div class=\"turn\"><div class=\"who\">Staff</div><div class=\"l\">No problem. Good luck!</div><div class=\"ipa\">/ˌnəʊ ˈprɒbləm. ɡʊd ˈlʌk/</div><div class=\"t\">不客气，祝你好运！</div></div>\n</div>\n\n<h2>05 难词发音 <span class=\"mins\">约 1 分钟</span></h2>\n<div class=\"word\"><div class=\"wtop\"><span class=\"w\">wallet</span><span class=\"ipa\">/ˈwɒlɪt/</span><span class=\"m\">钱包</span></div><div class=\"tip\">a 读短促的 <em>/ɒ/</em>（嘴圆），不是 /æ/；后半 -let 弱读成 <em>/lɪt/</em>，不要读成 /let/。</div></div>\n<div class=\"word\"><div class=\"wtop\"><span class=\"w\">jacket</span><span class=\"ipa\">/ˈdʒækɪt/</span><span class=\"m\">外套、夹克</span></div><div class=\"tip\">j 读 <em>/dʒ/</em>，a 是嘴张大的 <em>/æ/</em>；后半 -et 弱读成 <em>/ɪt/</em>，不读 /et/。</div></div>\n<div class=\"word\"><div class=\"wtop\"><span class=\"w\">charger</span><span class=\"ipa\">/ˈtʃɑːdʒə/</span><span class=\"m\">充电器</span></div><div class=\"tip\">g 读 <em>/dʒ/</em> 不读 /ɡ/；英式 r 不发音，ar 是长音 <em>/ɑː/</em>，结尾就是 <em>/ə/</em>。</div></div>\n<div class=\"word\"><div class=\"wtop\"><span class=\"w\">headphones</span><span class=\"ipa\">/ˈhedfəʊnz/</span><span class=\"m\">耳机</span></div><div class=\"tip\">重音在前面 <em>head</em>；ph 读 <em>/f/</em>，结尾 s 读 <em>/z/</em>。入耳式的小耳机也常说 earphones。</div></div>\n<div class=\"word\"><div class=\"wtop\"><span class=\"w\">keys</span><span class=\"ipa\">/kiːz/</span><span class=\"m\">钥匙（复数）</span></div><div class=\"tip\">ey 读长音 <em>/iː/</em>；结尾 s 读浊音 <em>/z/</em>，不要读成 /kiːs/。房卡丢了说 I've lost my room key。</div></div>\n<div class=\"word\"><div class=\"wtop\"><span class=\"w\">umbrella</span><span class=\"ipa\">/ʌmˈbrelə/</span><span class=\"m\">雨伞</span></div><div class=\"tip\">重音在中间 <em>-brel-</em>，开头 um 不重读；英国最常落在车上、店里的就是伞。</div></div>\n\n<h2>06 容易说错的 3 个点</h2>\n<div class=\"mis\"><div class=\"bad\">✗ I lost my wallet in the train.</div><div class=\"good\">✓ I left my wallet on the train.</div><div class=\"ipa\">/aɪ ˈleft maɪ ˈwɒlɪt ɒn ðə ˈtreɪn/</div><div class=\"cn\">我把钱包落在火车上了。</div><div class=\"why\">知道落在哪儿、是自己忘拿的，用 left（leave 的过去式）；lost 只是「找不到了」。火车、公交、飞机上用 on，不用 in。</div></div>\n<div class=\"mis\"><div class=\"bad\">✗ My phone was robbed.</div><div class=\"good\">✓ My phone was stolen.</div><div class=\"ipa\">/maɪ ˈfəʊn wəz ˈstəʊlən/</div><div class=\"cn\">我的手机被偷了。</div><div class=\"why\">rob 的对象是人或地方（I was robbed 我被抢了）；东西被偷要用 stolen。</div></div>\n<div class=\"mis\"><div class=\"bad\">✗ Can you help me find?</div><div class=\"good\">✓ Can you help me find it?</div><div class=\"ipa\">/kən ju ˌhelp mi ˈfaɪnd ɪt/</div><div class=\"cn\">你能帮我找找吗？</div><div class=\"why\">中文「帮我找找」可以不带宾语，英文 find 后面必须有 it 或具体的东西。</div></div>\n\n<h2>07 实务</h2>\n<div class=\"prac\"><div class=\"t2\">丢了东西先找谁</div><p>落在火车上：找这条线路的运营公司失物处，大站服务台也能帮忙登记；伦敦地铁、公交的东西统一归伦敦交通局失物处，可以在它官网在线登记。落在店里、餐厅、酒店：直接回去问前台，英国人捡到东西习惯交给前台。如果是被偷或被抢，非紧急情况打 101 或在警方官网在线报案，正在发生的危险才打 999。报案后一定记下报案编号（crime reference number）。</p></div>\n<div class=\"prac\"><div class=\"t2\">护照、银行卡和保险理赔</div><p>银行卡丢了第一时间在手机银行里冻结或打电话挂失，国内的卡也一样。中国护照丢失：先报警拿报案编号，再联系中国驻英国使领馆办理旅行证或补发，回国航班前要留出时间。理赔：旅行保险普遍要求尽快报警（不少保单写明 24 小时内），保留报案编号、购物凭证和照片；公司的差旅保险先找公司行政或差旅负责人，具体时限和材料以保单为准。</p></div>\n\n<h2>08 听懂英国人 <span class=\"mins\">约 2 分钟</span></h2>\n<div class=\"plan\">先点英文听慢速原句，再点音标听正常语速，对照音标看哪里连了、哪里吞了，跟着念两遍。</div>\n<div class=\"ls\"><div class=\"bk\" data-rf=\"0.8\" data-say=\"What does it look like?\">What does it look like?</div><div class=\"ipa\" data-rf=\"1.3\" data-say=\"What does it look like?\">/ˈwɒʔ dəz ɪʔ ˈlʊk laɪk/</div><div class=\"why\">长什么样？what 和 it 的 t 都变成<b>喉塞音</b>，只剩 <b>/wɒʔ/</b> 和 <b>/ɪʔ/</b>；does 弱读成 <b>/dəz/</b>。</div></div>\n<div class=\"ls\"><div class=\"bk\" data-rf=\"0.8\" data-say=\"It's got my cards in it.\">It's got my cards in it.</div><div class=\"ipa\" data-rf=\"1.3\" data-say=\"It's got my cards in it.\">/ɪts ˈɡɒʔ maɪ ˈkɑːdzɪn ɪʔ/</div><div class=\"why\">里面有我的银行卡。got 和句尾 it 的 t 变成<b>喉塞音</b>；cards in 的 z 和 i <b>连读</b>成 <b>/ˈkɑːdzɪn/</b>。</div></div>\n<div class=\"ls\"><div class=\"bk\" data-rf=\"0.8\" data-say=\"Let me check.\">Let me check.</div><div class=\"ipa\" data-rf=\"1.3\" data-say=\"Lemme check.\">/ˈlemi ˈtʃek/</div><div class=\"why\">我查一下。let 的 t 被吞掉，let me <b>连成</b> <b>/ˈlemi/</b>，听起来像一个词。</div></div>\n<div class=\"ls\"><div class=\"bk\" data-rf=\"0.8\" data-say=\"Fill in this form.\">Fill in this form.</div><div class=\"ipa\" data-rf=\"1.3\" data-say=\"Fill in this form.\">/ˈfɪlɪn ðɪs ˈfɔːm/</div><div class=\"why\">填一下这张表。fill 的 l 和 in <b>连读</b>成 <b>/ˈfɪlɪn/</b>；form 的 r 不发音，就是 <b>/fɔːm/</b>。</div></div>\n<div class=\"ls\"><div class=\"bk\" data-rf=\"0.8\" data-say=\"We'll call you if it turns up.\">We'll call you if it turns up.</div><div class=\"ipa\" data-rf=\"1.3\" data-say=\"We'll call you if it turns up.\">/wɪl ˈkɔːl jə ɪf ɪʔ ˌtɜːnz ˈʌp/</div><div class=\"why\">找到了我们给你打电话。we'll 弱读成 <b>/wɪl/</b>，you <b>弱读</b>成 <b>/jə/</b>；it 的 t 变成<b>喉塞音</b> <b>/ɪʔ/</b>；turns up <b>连读</b>。</div></div>\n"}/*LATEST-END*/;
window.UKD=window.UKD||{};

var synth = window.speechSynthesis;
var RATE = 0.95, voice = null, current = null;
function pickVoice(){
  if(!synth) return;
  var vs = synth.getVoices() || [];
  function find(fn){ for(var i=0;i<vs.length;i++){ if(fn(vs[i])) return vs[i]; } return null; }
  voice = find(function(v){ return /en[-_]GB/i.test(v.lang) && /Daniel|Serena|Kate|Arthur|Martha|Oliver|Sonia|Google UK/i.test(v.name); })
       || find(function(v){ return /en[-_]GB/i.test(v.lang); })
       || find(function(v){ return /^en/i.test(v.lang); });
}
var CJK = /[　-〿一-鿿＀-￯—…]/g;
function textOf(el){
  if(el.getAttribute('data-say')) return el.getAttribute('data-say');
  var c = el.cloneNode(true), i, kill = c.querySelectorAll('.mark, .say, .gl');
  for(i=0;i<kill.length;i++) kill[i].parentNode.removeChild(kill[i]);
  var t = (c.textContent || '').replace(CJK,' ');
  t = t.replace(/^\s*[A-Z]{2,}\s*:\s*/,'');
  return t.replace(/\s+/g,' ').trim();
}
function stop(){
  try{ if(synth) synth.cancel(); }catch(e){}
  if(current){ current.classList.remove('on'); current = null; }
}
function speak(btn, text, rf){
  if(current === btn){ stop(); return; }
  stop();
  if(!text || !synth) return;
  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-GB'; u.rate = RATE * (rf || 1); u.pitch = 1;
  if(voice) u.voice = voice;
  u.onend = u.onerror = function(){ if(current === btn){ btn.classList.remove('on'); current = null; } };
  btn.classList.add('on'); current = btn;
  try{ synth.speak(u); }catch(e){ stop(); }
}
var ICON = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">'
  + '<path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z" fill="currentColor"></path>'
  + '<path d="M15.6 9.2a4 4 0 0 1 0 5.6M18 6.8a7.4 7.4 0 0 1 0 10.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>'
  + '</svg>';
function attach(el){
  var text = textOf(el);
  if(!text || !/[A-Za-z]{2}/.test(text)) return;
  var b = document.createElement('button');
  b.type = 'button'; b.className = 'say';
  b.setAttribute('aria-label', '朗读：' + text);
  b.innerHTML = ICON;
  var rf = parseFloat(el.getAttribute('data-rf') || '1') || 1;
  b.addEventListener('click', function(ev){ ev.preventDefault(); ev.stopPropagation(); speak(b, text, rf); });
  el.appendChild(b);
}
function attachAll(root){
  if(!synth || typeof SpeechSynthesisUtterance === 'undefined') return;
  var nodes = root.querySelectorAll('.card .en, .wtop .w, .ph .pw, .turn .l, .three .p, .ls .bk, .ls .ipa');
  for(var i=0;i<nodes.length;i++) attach(nodes[i]);
}

var stage=document.getElementById('stage'), pick=document.getElementById('pick');
var prev=document.getElementById('prev'), next=document.getElementById('next');
var todayBox=document.getElementById('today');
function localDate(){
  var n=new Date(), p=function(x){return (x<10?'0':'')+x;};
  return n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate());
}
function dayForToday(){
  var t=localDate(), i;
  for(i=0;i<META.length;i++){ if(META[i].date===t) return META[i].d; }
  if(t<META[0].date) return META[0].d;
  return META[META.length-1].d;
}
var TODAY=dayForToday();
var seq=0;
function getDay(d, cb, retry){
  if(LATEST && LATEST.d===d) return cb(LATEST.h);
  if(window.UKD[d]) return cb(window.UKD[d]);
  var el=document.createElement('script');
  el.src='d/'+d+'.js'+(retry?'?r='+Date.now():'');
  el.onload=function(){ cb(window.UKD[d]||null); };
  el.onerror=function(){ cb(null); };
  (document.head||document.body).appendChild(el);
}
function render(d, retry){
  stop();
  var my=++seq;
  pick.value=String(d);
  prev.disabled=(d<=META[0].d); next.disabled=(d>=META[META.length-1].d);
  if(d===TODAY){ todayBox.innerHTML='今天这一篇'; }
  else { todayBox.innerHTML='正在看往期 · <b id="goto">回到今天</b>';
         var g=document.getElementById('goto'); if(g) g.addEventListener('click',function(){ render(TODAY); window.scrollTo(0,0); }); }
  stage.innerHTML='<div class="loading">正在打开这一篇…</div>';
  getDay(d, function(html){
    if(my!==seq) return;
    if(!html){
      stage.innerHTML='<div class="loading">这一篇没打开，可能是网络不稳。<b id="retry">点这里重试</b></div>';
      var r=document.getElementById('retry'); if(r) r.addEventListener('click',function(){ render(d, true); });
      return;
    }
    stage.innerHTML=html;
    attachAll(stage);
  }, retry);
  try{ window.localStorage.setItem('ukday', String(d)); }catch(e){}
}
pick.addEventListener('change',function(){ render(parseInt(pick.value,10)); window.scrollTo(0,0); });
prev.addEventListener('click',function(){ var d=parseInt(pick.value,10); if(d>META[0].d){ render(d-1); window.scrollTo(0,0);} });
next.addEventListener('click',function(){ var d=parseInt(pick.value,10); if(d<META[META.length-1].d){ render(d+1); window.scrollTo(0,0);} });
var bar=document.getElementById('speedbar');
if(synth && typeof SpeechSynthesisUtterance !== 'undefined'){
  pickVoice();
  if(typeof synth.onvoiceschanged !== 'undefined') synth.onvoiceschanged = pickVoice;
  bar.hidden=false;
  var bn=document.getElementById('sp-n'), bs=document.getElementById('sp-s');
  bn.addEventListener('click',function(){ RATE=0.95; bn.classList.add('act'); bs.classList.remove('act'); stop(); });
  bs.addEventListener('click',function(){ RATE=0.62; bs.classList.add('act'); bn.classList.remove('act'); stop(); });
}
window.addEventListener('pagehide', stop);
render(TODAY);
})();
</script>
